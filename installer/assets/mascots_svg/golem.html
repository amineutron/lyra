<style>
.m-golem *{transform-box:fill-box;transform-origin:center}
.m-golem .ru{fill:none;stroke:#e3d4ff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.35}
.m-golem .zz{animation:golem-zz 3.4s ease-in-out -1s infinite}
.m-golem .br{animation:golem-br 4s ease-in-out infinite}
.m-golem .s-sleep .ru{opacity:.15}
.m-golem .s-sleep .ey{animation:golem-dim 4s ease-in-out infinite}
.m-golem .s-idle .ey{animation:golem-look 5s ease-in-out infinite}
.m-golem .s-idle .ru{animation:golem-glow 4s ease-in-out infinite}
.m-golem .s-work .ey{animation:golem-scan 1.6s ease-in-out infinite}
.m-golem .s-work .ru{animation:golem-light 1.2s ease-in-out -.5s infinite}
.m-golem .s-work .cr{animation:golem-glow 1.2s ease-in-out infinite}
.m-golem .s-busy .ey{animation:golem-beat .4s ease-in-out infinite}
.m-golem .s-busy .ru{animation:golem-light .4s ease-in-out -.1s infinite}
.m-golem .s-busy .bar{animation:golem-bar .4s ease-in-out infinite}
.m-golem .s-ok .ru{stroke:#82d69c;opacity:1}
.m-golem .s-ok .halo{animation:golem-halo 1.6s ease-out infinite}
.m-golem .s-err .all{animation:golem-shake .35s ease-in-out 4}
.m-golem .s-err .ru{stroke:#ff8a9d;animation:golem-flick .5s steps(2) infinite}
.m-golem .red{animation:golem-red 1s ease-in-out infinite}
.m-golem .fall{animation:golem-fall 1.2s ease-in infinite}
.m-golem .s .d1{animation-delay:-.3s}.m-golem .s .d2{animation-delay:-.6s}.m-golem .s .d3{animation-delay:-.9s}.m-golem .s .d4{animation-delay:-1.2s}
@keyframes golem-zz{0%{transform:translate(0,4px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-10px);opacity:0}}
@keyframes golem-br{50%{transform:scale(1.015,1.025)}}
@keyframes golem-dim{50%{opacity:.4}}
@keyframes golem-look{0%,30%,100%{transform:translateX(0)}40%,60%{transform:translateX(-3px)}75%,90%{transform:translateX(3px)}}
@keyframes golem-glow{50%{opacity:.9}}
@keyframes golem-scan{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes golem-light{0%,100%{opacity:.2}40%{opacity:1}}
@keyframes golem-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
@keyframes golem-bar{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes golem-halo{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@keyframes golem-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
@keyframes golem-flick{50%{opacity:.35}}
@keyframes golem-red{0%,100%{opacity:.3}50%{opacity:.7}}
@keyframes golem-fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){.m-golem *{animation-duration:6s !important}}
</style>
