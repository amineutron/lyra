<style>
.m-satellite .t{transform-box:fill-box;transform-origin:center}
.m-satellite .fl,.m-satellite .hl{transform-box:fill-box;transform-origin:100% 50%}
.m-satellite .fr{transform-box:fill-box;transform-origin:0 50%}
.m-satellite .fl,.m-satellite .fr{transform:scaleX(.4)}
.m-satellite .z{animation:sat-z 3s ease-in infinite;opacity:0}
@keyframes sat-z{0%{transform:translate(0,6px);opacity:0}30%{opacity:.9}100%{transform:translate(6px,-12px);opacity:0}}
.m-satellite .fl2{animation:sat-fl 1.6s ease-in-out infinite}

.m-satellite .bk{animation:sat-bk 1.6s steps(1) infinite}
@keyframes sat-bk{0%{opacity:1}50%{opacity:.2}}
.m-satellite .bk2{animation:sat-bk .4s steps(1) infinite}
.m-satellite .a1,.m-satellite .a2,.m-satellite .a3{opacity:0;animation:sat-a 1.2s ease-out infinite}
.m-satellite .a2{animation-delay:.2s}.m-satellite .a3{animation-delay:.4s}
@keyframes sat-a{0%{opacity:0}20%{opacity:1}60%,100%{opacity:0}}
.m-satellite .dr{animation:sat-dr 1.5s ease-in infinite}
@keyframes sat-dr{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(30px);opacity:.3}}
.m-satellite .gb{animation:sat-gb 1.5s ease-in infinite}
@keyframes sat-gb{0%,70%{transform:scale(1)}85%{transform:scale(2.4)}100%{transform:scale(1)}}
.m-satellite .scn{animation:sat-scn 1.4s ease-in-out infinite alternate}
@keyframes sat-scn{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.m-satellite .gl{animation:sat-bk 1.6s steps(1) infinite}
.m-satellite .pas{animation:sat-pas 2.4s ease-in-out infinite alternate}
@keyframes sat-pas{from{transform:translateX(-9px) rotate(-4deg)}to{transform:translateX(9px) rotate(4deg)}}
.m-satellite .hop{animation:sat-hop 1s ease-out 1,sat-fl 2s ease-in-out 1s infinite}

.m-satellite .bur{animation:sat-bur 1.2s ease-out infinite}
@keyframes sat-bur{from{transform:scale(.3);opacity:1}to{transform:scale(2.6);opacity:0}}
.m-satellite .tum{animation:sat-tum 2.4s ease-in-out infinite}
@keyframes sat-tum{0%,100%{transform:rotate(-16deg)}40%{transform:rotate(20deg) translateX(3px)}70%{transform:rotate(-26deg) translateX(-3px)}}
.m-satellite .hg{animation:sat-hg 1.2s ease-in-out infinite alternate}
@keyframes sat-hg{from{transform:rotate(30deg)}to{transform:rotate(50deg)}}
.m-satellite .fk{animation:sat-fk 1s steps(1) infinite}
@keyframes sat-fk{0%{opacity:1}30%{opacity:.2}50%{opacity:.8}70%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.m-satellite *{animation-duration:8s!important}}
</style>
