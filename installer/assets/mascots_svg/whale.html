<style>.m-whale *{transform-box:fill-box;transform-origin:center}

.m-whale .p2{animation-delay:.5s}.m-whale .p3{animation-delay:1s}

.m-whale .red{opacity:0;animation:whale-red 1.6s ease-in-out infinite}
@keyframes whale-red{0%,100%{opacity:.25}40%,60%{opacity:.55}}
.m-whale .orb{animation:whale-orb 2s linear infinite}
@keyframes whale-orb{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.m-whale *{animation-duration:8s!important}}</style>
