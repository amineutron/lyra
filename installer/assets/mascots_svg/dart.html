<style>
.m-dart .t{transform-box:fill-box;transform-origin:center}
.m-dart .tl{transform-box:fill-box;transform-origin:right center}
.m-dart .z{animation:dart-z 3s ease-in infinite;opacity:0}
@keyframes dart-z{0%{transform:translate(0,6px);opacity:0}30%{opacity:.9}100%{transform:translate(6px,-12px);opacity:0}}
.m-dart .br{animation:dart-br 3.6s ease-in-out infinite}
@keyframes dart-br{0%,100%{transform:rotate(8deg)}50%{transform:rotate(8deg) translateY(2px)}}
.m-dart .aim{animation:dart-aim 2.4s ease-in-out infinite}
@keyframes dart-aim{0%,100%{transform:rotate(-3deg)}35%{transform:rotate(3deg)}60%{transform:translateX(-5px)}75%{transform:translateX(2px)}}
.m-dart .xh{animation:dart-xh 2.4s ease-in-out infinite}
@keyframes dart-xh{0%,100%{transform:scale(1);opacity:.5}60%{transform:scale(1.12);opacity:1}}
.m-dart .scan{animation:dart-scan 1.5s ease-in-out infinite alternate}
@keyframes dart-scan{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.m-dart .hunt{animation:dart-hunt 1.5s ease-in-out infinite alternate}
@keyframes dart-hunt{from{transform:translateY(-18px)}to{transform:translateY(18px)}}
.m-dart .sg{animation:dart-sg .5s linear infinite}
@keyframes dart-sg{to{stroke-dashoffset:-6}}
.m-dart .shoot{animation:dart-shoot .7s cubic-bezier(.2,.8,.3,1) infinite}
@keyframes dart-shoot{0%,22%,100%{transform:translateX(-8px)}50%{transform:translateX(9px)}62%{transform:translateX(5px)}}
.m-dart .hit{animation:dart-hit .7s ease-out infinite}
@keyframes dart-hit{0%,40%,100%{transform:scale(1)}52%{transform:scale(1.25,1.06)}}
.m-dart .ln{animation:dart-ln .7s ease-out infinite}
@keyframes dart-ln{0%,20%{transform:translateX(14px) scaleX(.3);opacity:0}50%{transform:none;opacity:1}100%{transform:translateX(-14px);opacity:0}}
.m-dart .spk{animation:dart-spk .7s ease-out infinite}
@keyframes dart-spk{0%,45%{transform:scale(0);opacity:1}100%{transform:scale(1.3);opacity:0}}
.m-dart .qv{animation:dart-qv 2.6s ease-out infinite}
@keyframes dart-qv{0%,36%,100%{transform:rotate(0)}6%{transform:rotate(-7deg)}12%{transform:rotate(6deg)}18%{transform:rotate(-4deg)}24%{transform:rotate(3deg)}30%{transform:rotate(-1.5deg)}}
.m-dart .bur{animation:dart-bur 1.1s ease-out 1 both}
@keyframes dart-bur{from{transform:scale(.4);opacity:1}to{transform:scale(1.9);opacity:0}}
.m-dart .pop{animation:dart-pop 1.8s ease-out infinite}
@keyframes dart-pop{0%{transform:scale(0);opacity:1}60%{transform:scale(1.2);opacity:1}100%{transform:scale(.8);opacity:0}}
.m-dart .drp{animation:dart-drp 1.8s ease-in-out infinite}
@keyframes dart-drp{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) translate(3px,-3px)}45%{transform:rotate(28deg) translate(-4px,12px)}55%{transform:rotate(24deg) translate(-4px,10px)}65%{transform:rotate(30deg) translate(-4px,12px)}85%{transform:rotate(26deg) translate(-4px,11px)}}
.m-dart .xf{animation:dart-xf .6s steps(1) infinite}
@keyframes dart-xf{0%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.m-dart *{animation-duration:8s!important}}
</style>
