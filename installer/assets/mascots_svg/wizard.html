<style>
.m-wizard *{transform-box:fill-box;transform-origin:center}
.m-wizard .eye{animation:wizard-blink 4s infinite}
.m-wizard .bob{animation:wizard-bob 2.4s ease-in-out infinite}
.m-wizard .arm{transform-origin:10% 90%}
.m-wizard .hat{transform-origin:50% 100%}
.m-wizard .glow{animation:wizard-glow 1.6s infinite}
.m-wizard .tw{animation:wizard-tw 1.4s ease-in-out infinite}
.m-wizard .d1{animation-delay:-.4s}.m-wizard .d2{animation-delay:-.9s}.m-wizard .d3{animation-delay:-1.2s}
.m-wizard .rise{animation:wizard-rise 1.6s ease-out infinite}
.m-wizard .zz{animation:wizard-zz 3s ease-in-out -1s infinite}
.m-wizard .s-sleep .hat{animation:wizard-droop 4s ease-in-out infinite}
.m-wizard .s-idle .arm{animation:wizard-hold 3s ease-in-out infinite}
.m-wizard .s-work .arm{animation:wizard-circ 1.8s ease-in-out infinite}
.m-wizard .s-work .pup{animation:wizard-look 1.8s ease-in-out infinite}
.m-wizard .s-work .trail{stroke-dasharray:70;animation:wizard-trail 1.8s linear infinite}
.m-wizard .s-busy .arm{animation:wizard-wave .7s ease-in-out infinite}
.m-wizard .s-busy .mouth{animation:wizard-talk .35s ease-in-out infinite}
.m-wizard .s-ok .all{animation:wizard-jump 1.2s ease-out 2, wizard-bob 2s ease-in-out 2.4s infinite}
.m-wizard .s-ok .arm{animation:wizard-cheer 1.2s ease-in-out infinite}
.m-wizard .s-err .all{animation:wizard-shake .5s ease-in-out 3}
.m-wizard .s-err .hat{animation:wizard-limp 3s ease-in-out infinite}
.m-wizard .fall{animation:wizard-fall 1s ease-in infinite}
.m-wizard .blush{animation:wizard-blush 1.1s ease-in-out infinite;opacity:.5}
.m-wizard .puff{animation:wizard-puff 2.2s ease-out infinite}
@keyframes wizard-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wizard-bob{50%{transform:translateY(-2px)}}
@keyframes wizard-glow{50%{transform:scale(1.5);opacity:.5}}
@keyframes wizard-tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes wizard-rise{0%{transform:translateY(4px) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-16px) scale(1);opacity:0}}
@keyframes wizard-zz{0%{transform:translate(0,4px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-10px);opacity:0}}
@keyframes wizard-droop{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(3deg)}}
@keyframes wizard-hold{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes wizard-circ{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(10deg)}}
@keyframes wizard-look{0%,100%{transform:translate(-1.5px,-1px)}50%{transform:translate(1.5px,-1.5px)}}
@keyframes wizard-trail{0%{stroke-dashoffset:70;opacity:1}80%{opacity:1}100%{stroke-dashoffset:-70;opacity:0}}
@keyframes wizard-wave{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(16deg)}}
@keyframes wizard-talk{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.3)}}
@keyframes wizard-jump{0%,100%{transform:translateY(0)}35%{transform:translateY(-9px)}60%{transform:translateY(0) scaleY(.94)}}
@keyframes wizard-cheer{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(-10deg)}}
@keyframes wizard-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-2deg)}75%{transform:translateX(3px) rotate(2deg)}}
@keyframes wizard-limp{0%,100%{transform:rotate(11deg)}50%{transform:rotate(15deg)}}
@keyframes wizard-fall{0%{transform:translate(0,0);opacity:1}100%{transform:translate(3px,22px);opacity:0}}
@keyframes wizard-blush{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes wizard-puff{0%{transform:translate(0,2px) scale(.4);opacity:.9}100%{transform:translate(-3px,-14px) scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.m-wizard *{animation-duration:6s !important}}
</style>
