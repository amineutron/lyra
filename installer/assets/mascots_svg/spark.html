<style>
.m-spark .t{transform-box:fill-box;transform-origin:center}
.m-spark .sl{animation:spark-sl 3.6s ease-in-out infinite}
@keyframes spark-sl{0%,100%{transform:scale(.62)}50%{transform:scale(.7)}}
.m-spark .br{animation:spark-br 2.4s ease-in-out infinite}
@keyframes spark-br{50%{transform:scale(1.06)}}
.m-spark .sw{animation:spark-sw 3s ease-in-out infinite}
@keyframes spark-sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.m-spark .tw{animation:spark-tw 1.8s ease-in-out infinite}
@keyframes spark-tw{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1.1);opacity:1}}
.m-spark .rot{animation:spark-rot 5s linear infinite}
@keyframes spark-rot{to{transform:rotate(360deg)}}
.m-spark .orb{animation:spark-rot 2.4s linear infinite reverse}
.m-spark .pu{animation:spark-pu 1.6s ease-in-out infinite}
@keyframes spark-pu{0%,100%{transform:scale(.8);opacity:.9}50%{transform:scale(1.25);opacity:.4}}
.m-spark .fp{animation:spark-fp .4s ease-in-out infinite alternate}
@keyframes spark-fp{from{transform:scale(.75)}to{transform:scale(1.2)}}
.m-spark .ray{animation:spark-ray .5s ease-in-out infinite alternate}
@keyframes spark-ray{from{transform:scale(.5);opacity:.4}to{transform:scale(1.15);opacity:1}}
.m-spark .tk{animation:spark-tk .5s ease-in-out infinite alternate}
@keyframes spark-tk{from{transform:scale(.9,1.06) rotate(-8deg)}to{transform:scale(1.1,.94) rotate(8deg)}}
.m-spark .wv{animation:spark-wv .9s ease-out infinite}
@keyframes spark-wv{from{transform:scale(.5);opacity:.9}to{transform:scale(1.7);opacity:0}}
.m-spark .z{animation:spark-z 3s ease-in infinite;opacity:0}
@keyframes spark-z{0%{transform:translate(0,6px);opacity:0}30%{opacity:.9}100%{transform:translate(6px,-12px);opacity:0}}
.m-spark .hop{animation:spark-hop .9s ease-out 1,spark-br 2s ease-in-out .9s infinite}
@keyframes spark-hop{0%{transform:scale(.5) rotate(-90deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.m-spark .bur{animation:spark-bur 1.1s ease-out 1 both}
@keyframes spark-bur{from{transform:scale(.4);opacity:1}to{transform:scale(1.9);opacity:0}}
.m-spark .pop{animation:spark-pop 1.8s ease-out infinite}
@keyframes spark-pop{0%{transform:scale(0);opacity:1}60%{transform:scale(1.2);opacity:1}100%{transform:scale(.8);opacity:0}}
.m-spark .tick{stroke-dasharray:30;animation:spark-tick 2s ease-out infinite}
@keyframes spark-tick{0%{stroke-dashoffset:30}30%,100%{stroke-dashoffset:0}}
.m-spark .shk{animation:spark-shk .45s linear infinite}
@keyframes spark-shk{0%,100%{transform:rotate(14deg)}25%{transform:rotate(8deg) translateX(-3px)}75%{transform:rotate(20deg) translateX(3px)}}
.m-spark .fl{animation:spark-fl 1.1s steps(1) infinite}
@keyframes spark-fl{0%{opacity:1}15%{opacity:.35}25%{opacity:1}55%{opacity:.5}65%{opacity:1}}
.m-spark .gl{animation:spark-gl .3s steps(1) infinite}
@keyframes spark-gl{0%{transform:translate(0,0)}33%{transform:translate(3px,-2px)}66%{transform:translate(-3px,2px)}}
.m-spark .sp{animation:spark-sp 1.2s ease-out infinite}
@keyframes spark-sp{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.m-spark *{animation-duration:8s!important}}
</style>
