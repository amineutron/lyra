<style>
.m-owl *{transform-box:fill-box;transform-origin:center}
.m-owl .hd{transform-origin:50% 100%}
.m-owl .wl{transform-origin:70% 10%}.m-owl .wr{transform-origin:30% 10%;--k:-1}
.m-owl .pu circle:first-child{fill:#1a2a44}.m-owl .pu circle+circle{fill:#fff}
.m-owl .eye{animation:owl-blink 4.5s infinite}
.m-owl .zz{animation:owl-zz 3s ease-in-out -1s infinite}
.m-owl .dot{animation:owl-dot 1.2s ease-in-out -.4s infinite}
.m-owl .breath{animation:owl-br 3.4s ease-in-out infinite}
.m-owl .s-sleep .hd{animation:owl-nod 5s ease-in-out infinite}
.m-owl .s-idle .hd{animation:owl-tilt 5s ease-in-out infinite}
.m-owl .s-idle .pu{animation:owl-look 5s ease-in-out infinite}
.m-owl .s-work .hd{animation:owl-turn 2.6s ease-in-out infinite}
.m-owl .s-work .pu{animation:owl-dart 1.3s ease-in-out infinite}
.m-owl .s-work .big{animation:owl-big 1.3s ease-in-out infinite}
.m-owl .s-busy .hd{animation:owl-talk .5s ease-in-out infinite}
.m-owl .s-busy .bk{animation:owl-beak .25s ease-in-out infinite}
.m-owl .s-busy .wl{animation:owl-flap .5s ease-in-out infinite}
.m-owl .s-busy .wr{animation:owl-flap .5s ease-in-out infinite}
.m-owl .s-busy .pu{animation:owl-pulse .5s ease-in-out infinite}
.m-owl .s-ok .all{animation:owl-hop 1s ease-out 2}
.m-owl .s-ok .wl{transform:rotate(55deg)}.m-owl .s-ok .wr{transform:rotate(-55deg)}
.m-owl .s-err .all{animation:owl-shake .4s ease-in-out 4}
.m-owl .s-err .hd{animation:owl-wob 1.2s ease-in-out infinite}
.m-owl .red{animation:owl-red 1s ease-in-out infinite}
.m-owl .spin{animation:owl-spin 2s linear infinite}
.m-owl .s .d1{animation-delay:-.3s}.m-owl .s .d2{animation-delay:-.7s}.m-owl .s .d3{animation-delay:-1.1s}
@keyframes owl-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes owl-zz{0%{transform:translate(0,4px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-10px);opacity:0}}
@keyframes owl-dot{0%,100%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@keyframes owl-br{50%{transform:scale(1.03,1.05)}}
@keyframes owl-nod{0%,100%{transform:rotate(4deg) translateY(2px)}50%{transform:rotate(7deg) translateY(3px)}}
@keyframes owl-tilt{0%,35%,100%{transform:rotate(0)}50%,80%{transform:rotate(-9deg)}}
@keyframes owl-look{0%,35%,100%{transform:translateX(0)}50%,80%{transform:translateX(-2px)}}
@keyframes owl-turn{0%,100%{transform:rotate(-16deg) translateX(-3px)}50%{transform:rotate(16deg) translateX(3px)}}
@keyframes owl-dart{0%,100%{transform:translate(-2px,-2px) scale(.7)}50%{transform:translate(2px,-1px) scale(.7)}}
@keyframes owl-big{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes owl-talk{0%,100%{transform:translateY(0)}50%{transform:translateY(2px) rotate(-2deg)}}
@keyframes owl-beak{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1.5)}}
@keyframes owl-flap{0%,100%{transform:rotate(0)}50%{transform:rotate(calc(var(--k,1)*28deg))}}
@keyframes owl-pulse{0%,100%{transform:scale(1.15)}50%{transform:scale(1.4)}}
@keyframes owl-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes owl-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes owl-wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes owl-red{0%,100%{opacity:.4}50%{opacity:.8}}
@keyframes owl-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.m-owl *{animation-duration:6s !important}}
</style>
