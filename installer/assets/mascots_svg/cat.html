<style>
.m-cat *{transform-box:fill-box;transform-origin:center}
.m-cat .hd{transform-origin:50% 100%}
.m-cat .el,.m-cat .er{transform-origin:50% 100%}
.m-cat .tl{transform-origin:0 100%}
.m-cat .eye{animation:cat-blink 4.5s infinite}
.m-cat .zz{animation:cat-zz 3s ease-in-out -1s infinite}
.m-cat .br{animation:cat-br 3.4s ease-in-out infinite}
.m-cat .fl{animation:cat-fl 1.2s ease-in-out -.4s infinite}
.m-cat .s-sleep .hd{animation:cat-nod 5s ease-in-out infinite}
.m-cat .s-sleep .peek{animation:cat-peek 5s ease-in-out -3.9s infinite}
.m-cat .s-idle .tl{animation:cat-sway 3s ease-in-out infinite}
.m-cat .s-idle .er{animation:cat-flick 4s ease-in-out infinite}
.m-cat .s-idle .hd{animation:cat-tilt 6s ease-in-out infinite}
.m-cat .s-work .tl{animation:cat-lash .5s ease-in-out infinite}
.m-cat .s-work .pu{animation:cat-track 1.2s ease-in-out infinite}
.m-cat .s-work .hd{animation:cat-watch 2.4s ease-in-out infinite}
.m-cat .s-work .el{transform:rotate(14deg)}.m-cat .s-work .er{transform:rotate(-14deg)}
.m-cat .s-busy .tl{animation:cat-sway .6s ease-in-out infinite}
.m-cat .s-busy .hd{animation:cat-talk .5s ease-in-out infinite}
.m-cat .s-busy .mo{animation:cat-mouth .25s ease-in-out infinite}
.m-cat .s-busy .er{animation:cat-flick .8s ease-in-out infinite}
.m-cat .s-ok .all{animation:cat-hop 1s ease-out 2}
.m-cat .s-ok .tl{transform:rotate(-40deg)}
.m-cat .s-err .all{animation:cat-scare .5s ease-out 1,cat-shake .35s ease-in-out .5s 4}
.m-cat .s-err .tl{animation:cat-puff .3s ease-in-out infinite}
.m-cat .s-err .hd{transform:scale(1.08)}
.m-cat .s-err .el{transform:rotate(-24deg)}.m-cat .s-err .er{transform:rotate(24deg)}
.m-cat .red{animation:cat-red 1s ease-in-out infinite}
.m-cat .s .d1{animation-delay:-.3s}.m-cat .s .d2{animation-delay:-.7s}.m-cat .s .d3{animation-delay:-1.1s}
@keyframes cat-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes cat-zz{0%{transform:translate(0,4px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-10px);opacity:0}}
@keyframes cat-br{50%{transform:scale(1.03,1.05)}}
@keyframes cat-fl{0%,100%{opacity:.3;transform:translateY(0) scale(.8)}50%{opacity:1;transform:translateY(-4px) scale(1.1)}}
@keyframes cat-nod{0%,100%{transform:rotate(3deg) translateY(2px)}50%{transform:rotate(5deg) translateY(3px)}}
@keyframes cat-peek{0%,70%,92%,100%{transform:scaleY(0)}76%,86%{transform:scaleY(1)}}
@keyframes cat-sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes cat-flick{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-14deg)}90%{transform:rotate(4deg)}}
@keyframes cat-tilt{0%,40%,100%{transform:rotate(0)}55%,85%{transform:rotate(6deg)}}
@keyframes cat-lash{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(22deg)}}
@keyframes cat-track{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes cat-watch{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes cat-talk{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
@keyframes cat-mouth{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1.2)}}
@keyframes cat-hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes cat-scare{0%{transform:translateY(0)}40%{transform:translateY(-12px)}100%{transform:translateY(0)}}
@keyframes cat-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes cat-puff{0%,100%{transform:rotate(-6deg) scale(1.15)}50%{transform:rotate(8deg) scale(1.15)}}
@keyframes cat-red{0%,100%{opacity:.35}50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.m-cat *{animation-duration:6s !important}}
</style>
