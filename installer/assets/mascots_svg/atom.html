.m-atom .rays{animation:atom-rays 1.6s ease-in-out infinite}
@keyframes atom-rays{0%{opacity:0;transform:scale(.6)}30%,70%{opacity:1;transform:scale(1)}100%{opacity:.4;transform:scale(1.08)}}
.m-atom .red{animation:atom-red .8s ease-in-out infinite}
@keyframes atom-red{0%,100%{fill:#eb6f92}50%{fill:#e5484d}}
.m-atom .shk{animation:atom-shk .16s linear infinite}
@keyframes atom-shk{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.m-atom .jit{animation:atom-jit 1.3s steps(1) infinite}
@keyframes atom-jit{0%{transform:rotate(0)}20%{transform:rotate(6deg)}40%{transform:rotate(-5deg)}60%{transform:rotate(3deg)}80%{transform:rotate(-8deg)}}
.m-atom .lost{animation:atom-lost 1.8s ease-in infinite}
@keyframes atom-lost{0%{transform:translate(0,0);opacity:1}60%{transform:translate(8px,34px);opacity:1}75%{transform:translate(10px,30px) scaleY(.6)}85%{transform:translate(12px,34px);opacity:.8}100%{transform:translate(14px,34px);opacity:0}}
.m-atom .arc{animation:atom-arc .5s steps(1) infinite}
.m-atom .arc2{animation:atom-arc .5s steps(1) -.25s infinite}
@keyframes atom-arc{0%{opacity:0}20%{opacity:1}55%{opacity:0}}
.m-atom .puff{animation:atom-puff 2s ease-out infinite}
.m-atom .puff2{animation:atom-puff 2s ease-out -1s infinite}
@keyframes atom-puff{0%{opacity:.7;transform:translateY(6px) scale(.5)}100%{opacity:0;transform:translateY(-18px) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.m-atom [class]{animation-duration:20s!important}}
</style>
