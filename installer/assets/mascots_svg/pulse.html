<style>
.m-pulse *{transform-box:fill-box}
.m-pulse .ht{transform-origin:50% 60%}
.m-pulse .ck{fill:none;stroke:#0f2a1c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:pulse-ck 2.4s ease-out infinite}
.m-pulse .ec{fill:none;stroke:#82d69c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.m-pulse .re{stroke:#eb6f92}
.m-pulse .dm{opacity:.28}
.m-pulse .sw{stroke-dasharray:24 100;stroke-dashoffset:24;animation:pulse-sw 1.6s linear infinite}
.m-pulse .sf{stroke-dasharray:24 100;stroke-dashoffset:24;animation:pulse-sw .9s linear infinite}
.m-pulse .rg{fill:none;stroke:#82d69c;stroke-width:2.4;transform-origin:50% 50%;opacity:0}
.m-pulse .st{fill:#7C6CF0;transform-origin:50% 50%}
.m-pulse .dt{fill:#82d69c;transform-origin:50% 50%}
.m-pulse .zz{fill:none;stroke:#b8ecc8;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:pulse-z 3.6s ease-in-out infinite}
.m-pulse .h1{animation:pulse-b1 3s ease-in-out infinite}
.m-pulse .h2{animation:pulse-b2 1.6s ease-in-out infinite}
.m-pulse .h3{animation:pulse-b2 .9s ease-in-out infinite}
.m-pulse .h4{animation:pulse-b3 .5s ease-in-out infinite}
.m-pulse .h5{animation:pulse-pop 2.4s ease-out infinite}
.m-pulse .h6{animation:pulse-sick 1.4s ease-in-out infinite}
.m-pulse .r1{animation:pulse-ring 1s ease-out infinite}
.m-pulse .r2{animation:pulse-ring 1s .5s ease-out infinite}
.m-pulse .r3{animation:pulse-ring 2.4s .3s ease-out infinite}
.m-pulse .tw{animation:pulse-twk 1s ease-in-out infinite}
.m-pulse .amp{animation:pulse-amp .5s ease-in-out infinite;transform-origin:50% 100%}
.m-pulse .fl{animation:pulse-fl 1.2s steps(2) infinite}
.m-pulse .tn{animation:pulse-tn 1.6s ease-in-out infinite}
.m-pulse .tr{animation:pulse-tr 1.4s ease-in-out infinite}
@keyframes pulse-sw{to{stroke-dashoffset:-100}}
@keyframes pulse-b1{0%,100%{transform:scale(.86)}50%{transform:scale(.93)}}
@keyframes pulse-b2{0%,35%,100%{transform:scale(1)}42%{transform:scale(1.14)}50%{transform:scale(1.02)}57%{transform:scale(1.1)}70%{transform:scale(1)}}
@keyframes pulse-b3{0%,100%{transform:scale(1.04)}30%{transform:scale(1.22)}}
@keyframes pulse-pop{0%{transform:scale(.7)}12%{transform:scale(1.3)}25%{transform:scale(.98)}40%,60%{transform:scale(1.14)}50%{transform:scale(1.04)}100%{transform:scale(1.04)}}
@keyframes pulse-sick{0%,100%{transform:scale(.88) rotate(-7deg)}20%{transform:scale(.8) rotate(5deg)}50%{transform:scale(.9) rotate(7deg)}}
@keyframes pulse-ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.6);opacity:0}}
@keyframes pulse-twk{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes pulse-amp{0%,100%{transform:scaleY(.8)}30%{transform:scaleY(1.25)}}
@keyframes pulse-fl{0%{opacity:1}50%{opacity:.35}}
@keyframes pulse-tn{0%,100%{opacity:0}40%{opacity:.5}}
@keyframes pulse-tr{0%{opacity:.15}35%,100%{opacity:.85}}
@keyframes pulse-ck{0%,10%{stroke-dashoffset:100}35%,100%{stroke-dashoffset:0}}
@keyframes pulse-z{0%{opacity:0;transform:translate(0,6px)}30%,60%{opacity:.9}100%{opacity:0;transform:translate(6px,-8px)}}
@media (prefers-reduced-motion:reduce){.m-pulse *{animation-duration:6s!important}}
</style>
<svg class="mx m-pulse" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <path id="pulse-hp" d="M60 72C28 52 32 22 50 24C56 25 60 30 60 34C60 30 64 25 70 24C88 22 92 52 60 72Z"/>
  <g id="pulse-h"><use href="#pulse-hp" fill="#82d69c"/><path d="M72 62C80 54 84 44 80 36C86 46 82 58 72 62Z" fill="#5fae78" opacity=".7"/><ellipse cx="43" cy="37" rx="3.2" ry="6" fill="#e3f9e9" opacity=".8" transform="rotate(30 43 37)"/></g>
  <path id="pulse-p" d="M8 96H34L38 91L42 96H50L54 104L60 76L66 108L70 96H78L83 90L88 96H112" pathLength="100"/>
  <path id="pulse-q" d="M8 96H22L26 84L32 106L38 84L44 106L50 84L56 106L62 84L68 106L74 84L80 100L86 96H112" pathLength="100"/>
 </defs>
 <g class="s s-sleep">
  <path class="ec" d="M8 96H112" stroke-dasharray="4 7" opacity=".5"/>
  <g class="ht h1"><use href="#pulse-h"/><use href="#pulse-hp" fill="#1f5a3a" opacity=".4"/></g>
  <path class="zz" d="M88 24h9l-9 10h9"/><path class="zz" style="animation-delay:1.2s" d="M98 12h6l-6 7h6"/>
 </g>
 <g class="s s-idle">
  <use class="ec dm" href="#pulse-p"/><use class="ec sw" href="#pulse-p"/>
  <g class="ht h2"><use href="#pulse-h"/></g>
  <path class="st tw" d="M100 30l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/>
 </g>
 <g class="s s-work">
  <use class="ec dm" href="#pulse-q"/><use class="ec sf" href="#pulse-q"/>
  <g class="ht h3"><use href="#pulse-h"/><use class="tn" href="#pulse-hp" fill="#d9f7e2"/></g>
  <circle class="dt tw" cx="96" cy="40" r="2.4"/><circle class="dt tw" style="animation-delay:.3s" cx="104" cy="28" r="3.2"/><circle class="dt tw" style="animation-delay:.6s" cx="14" cy="34" r="2.6"/><circle class="dt tw" style="animation-delay:.9s" cx="20" cy="22" r="2"/>
 </g>
 <g class="s s-busy">
  <g class="amp"><use class="ec" href="#pulse-p"/></g>
  <circle class="rg r1" cx="60" cy="46" r="26"/><circle class="rg r2" cx="60" cy="46" r="26"/>
  <g class="ht h4"><use href="#pulse-h"/><use class="tn" href="#pulse-hp" fill="#ffffff"/></g>
  <path class="ec dm" d="M14 38q-6 8 0 16M106 38q6 8 0 16"/>
 </g>
 <g class="s s-ok">
  <path class="ec" d="M8 96H112"/><circle class="rg r3" cx="60" cy="46" r="26"/>
  <g class="ht h5"><use href="#pulse-h"/><path class="ck" pathLength="100" d="M47 44l9 9l17-18"/></g>
  <path class="st tw" d="M100 28l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path class="st tw" style="animation-delay:.5s" d="M18 30l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/>
 </g>
 <g class="s s-err">
  <path class="ec re fl" d="M8 96H112"/><path class="ec re" d="M52 88l16 16m0-16l-16 16"/>
  <g class="ht h6"><use href="#pulse-h"/><use class="tr" href="#pulse-hp" fill="#e5484d"/><path class="ck" style="stroke:#fbe4ea;stroke-dasharray:none;animation:none;stroke-width:3.5" d="M62 30L55 44L66 50L58 66"/></g>
 </g>
</svg>
