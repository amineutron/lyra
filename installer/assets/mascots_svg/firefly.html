<style>
.m-firefly *{transform-box:fill-box}
.m-firefly g{transform-origin:50% 50%}
.m-firefly .wg{transform-origin:50% 90%}
.m-firefly .ha{transform-origin:50% 50%}
.m-firefly .dt{fill:#d7f7a5;transform-origin:50% 50%}
.m-firefly .st{fill:#7C6CF0;transform-origin:50% 50%}
.m-firefly .sp{fill:#d7f7a5;transform-origin:50% 50%}
.m-firefly .zz{fill:none;stroke:#b8ecc8;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:firefly-z 3.6s ease-in-out infinite}
.m-firefly .a1{animation:firefly-drift 4s ease-in-out infinite}
.m-firefly .a2{animation:firefly-flap .16s ease-in-out infinite alternate}
.m-firefly .a3{animation:firefly-halo 2s ease-in-out infinite}
.m-firefly .a4{animation:firefly-sway 4s ease-in-out infinite}
.m-firefly .a5{animation:firefly-dim 4s ease-in-out infinite}
.m-firefly .w1{animation:firefly-wander 3.6s ease-in-out infinite}
.m-firefly .w2{animation:firefly-flick 3.6s steps(1) infinite}
.m-firefly .w3{animation:firefly-trail 1.8s ease-out infinite}
.m-firefly .b1{animation:firefly-hop .5s ease-in-out infinite}
.m-firefly .b2{animation:firefly-beat .5s ease-out infinite}
.m-firefly .b3{animation:firefly-ray .5s ease-out infinite}
.m-firefly .c1{animation:firefly-loop 2.8s ease-in-out infinite}
.m-firefly .c2{animation:firefly-twk 1.2s ease-in-out infinite}
.m-firefly .c3{animation:firefly-big 1.6s ease-in-out infinite}
.m-firefly .e1{animation:firefly-fall 3s ease-in-out infinite}
.m-firefly .e2{animation:firefly-sput 3s steps(1) infinite}
.m-firefly .e3{animation:firefly-droop .5s ease-in-out infinite alternate}
.m-firefly .e4{animation:firefly-red 1.5s ease-in-out infinite}
@keyframes firefly-drift{0%,100%{transform:translate(-5px,2px)}25%{transform:translate(2px,-4px)}50%{transform:translate(5px,3px)}75%{transform:translate(-2px,-3px)}}
@keyframes firefly-flap{0%{transform:scaleY(1)}100%{transform:scaleY(.45)}}
@keyframes firefly-halo{0%,100%{opacity:.18;transform:scale(.9)}50%{opacity:.6;transform:scale(1.15)}}
@keyframes firefly-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes firefly-dim{0%,100%{opacity:.1}50%{opacity:.3}}
@keyframes firefly-wander{0%,100%{transform:translate(-22px,6px) rotate(-12deg)}25%{transform:translate(0,-12px) rotate(4deg)}50%{transform:translate(22px,4px) rotate(12deg)}75%{transform:translate(4px,12px) rotate(-6deg)}}
@keyframes firefly-flick{0%{opacity:.15}12%{opacity:1}20%{opacity:.15}28%{opacity:1}36%{opacity:.15}60%{opacity:.15}70%{opacity:1}100%{opacity:1}}
@keyframes firefly-trail{0%{transform:scale(1);opacity:.8}100%{transform:scale(.2);opacity:0}}
@keyframes firefly-hop{0%,100%{transform:translateY(2px)}50%{transform:translateY(-5px)}}
@keyframes firefly-beat{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.9)}}
@keyframes firefly-ray{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
@keyframes firefly-loop{0%{transform:rotate(0)}30%{transform:rotate(360deg)}30.1%,100%{transform:rotate(0)}}
@keyframes firefly-twk{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes firefly-big{0%,100%{opacity:.45;transform:scale(1.05)}50%{opacity:.8;transform:scale(1.3)}}
@keyframes firefly-fall{0%,100%{transform:translateY(-6px) rotate(-4deg)}35%{transform:translateY(12px) rotate(-18deg)}50%{transform:translateY(12px) rotate(14deg)}70%{transform:translateY(-2px) rotate(-8deg)}}
@keyframes firefly-sput{0%{opacity:.7}10%{opacity:.05}20%{opacity:.5}30%{opacity:0}45%{opacity:.25}55%,100%{opacity:0}}
@keyframes firefly-droop{0%{transform:rotate(18deg) scaleY(.8)}100%{transform:rotate(-6deg) scaleY(.5)}}
@keyframes firefly-red{0%{opacity:.1}30%,100%{opacity:.9}}
@keyframes firefly-z{0%{opacity:0;transform:translate(0,6px)}30%,60%{opacity:.9}100%{opacity:0;transform:translate(6px,-8px)}}
@media (prefers-reduced-motion:reduce){.m-firefly *{animation-duration:8s!important}}
</style>
