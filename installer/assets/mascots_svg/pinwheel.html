<style>
.m-pinwheel [class]{transform-box:fill-box;transform-origin:center}
.m-pinwheel .s{--b1:#f6c177;--b2:#e8a14f}
.m-pinwheel .s-sleep{--b1:#d7a566;--b2:#b98a4e}
.m-pinwheel .s-work{--b1:#f6c177;--b2:#c4a7e7}
.m-pinwheel .s-busy{--b1:#ffe3b0;--b2:#f6c177}
.m-pinwheel .s-ok{--b1:#f6c177;--b2:#82d69c}
.m-pinwheel .s-err{--b1:#eb6f92;--b2:#e5484d}
.m-pinwheel .sl{animation:pw-spin 12s linear infinite}
.m-pinwheel .md{animation:pw-spin 1.8s cubic-bezier(.6,0,.3,1) infinite}
.m-pinwheel .fs{animation:pw-spin .45s linear infinite}
.m-pinwheel .rv{animation:pw-spin 1.4s linear infinite reverse}
.m-pinwheel .okk{animation:pw-fin 1.2s ease-out 1,pw-spin 6s linear 1.2s infinite}
@keyframes pw-spin{to{transform:rotate(360deg)}}
@keyframes pw-fin{to{transform:rotate(720deg)}}
.m-pinwheel .sway{animation:pw-sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pw-sway{50%{transform:rotate(1.5deg)}}
.m-pinwheel .vib{animation:pw-vib .1s linear infinite}
@keyframes pw-vib{25%{transform:translateX(-1px)}75%{transform:translateX(1px)}}
.m-pinwheel .br{animation:pw-br 4s ease-in-out infinite}
@keyframes pw-br{50%{transform:scale(1.03)}}
.m-pinwheel .zz{animation:pw-z 3.6s ease-in infinite}
@keyframes pw-z{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.m-pinwheel .tw{animation:pw-tw 1.4s steps(1) infinite}
.m-pinwheel .tw2{animation:pw-tw 1.4s steps(1) -.7s infinite}
@keyframes pw-tw{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1)}60%{opacity:.2;transform:scale(.6)}80%{opacity:0}}
.m-pinwheel .wd{animation:pw-wd 1.6s ease-in infinite}
.m-pinwheel .wd2{animation:pw-wd 1.6s ease-in -.8s infinite}
@keyframes pw-wd{0%{opacity:0;transform:translateX(-6px)}30%{opacity:.8}100%{opacity:0;transform:translateX(18px)}}
.m-pinwheel .blur{animation:pw-bl .3s linear infinite}
@keyframes pw-bl{50%{opacity:.1}}
.m-pinwheel .halo{animation:pw-halo 1.2s ease-out infinite}
@keyframes pw-halo{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.4)}}
.m-pinwheel .try{animation:pw-try 1.5s ease-in-out infinite}
@keyframes pw-try{0%,100%{transform:rotate(0)}25%{transform:rotate(55deg)}35%{transform:rotate(18deg)}45%{transform:rotate(24deg)}55%{transform:rotate(-8deg)}70%{transform:rotate(0)}}
.m-pinwheel .tilt{animation:pw-tilt 1.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes pw-tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}45%{transform:rotate(4deg)}55%{transform:rotate(-3deg)}}
.m-pinwheel .pr{animation:pw-pr .8s ease-in-out infinite}
@keyframes pw-pr{0%,100%{opacity:0}50%{opacity:.7}}
.m-pinwheel .arc{animation:pw-arc .5s steps(1) infinite}
.m-pinwheel .arc2{animation:pw-arc .5s steps(1) -.25s infinite}
@keyframes pw-arc{0%{opacity:0}20%{opacity:1}55%{opacity:0}}
.m-pinwheel .puff{animation:pw-puff 2s ease-out infinite}
.m-pinwheel .puff2{animation:pw-puff 2s ease-out -1s infinite}
@keyframes pw-puff{0%{opacity:.7;transform:translateY(6px) scale(.5)}100%{opacity:0;transform:translateY(-18px) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.m-pinwheel [class]{animation-duration:20s!important}}
</style>
