<style>
.m-fan .t{transform-box:fill-box;transform-origin:center}
.m-fan .hd{transform-box:fill-box;transform-origin:50% 100%}
.m-fan .sp{animation:fan-sp 6s linear infinite}
.m-fan .sp2{animation:fan-sp 1.5s linear infinite}
.m-fan .sp3{animation:fan-sp .3s linear infinite}
.m-fan .sp0{animation:fan-sp 30s linear infinite}
@keyframes fan-sp{to{transform:rotate(360deg)}}
.m-fan .z{animation:fan-z 3s ease-in infinite;opacity:0}
@keyframes fan-z{0%{transform:translate(0,6px);opacity:0}30%{opacity:.9}100%{transform:translate(6px,-12px);opacity:0}}
.m-fan .nod{animation:fan-nod 4s ease-in-out infinite}
@keyframes fan-nod{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.m-fan .osc{animation:fan-osc 1.4s ease-in-out infinite alternate}
@keyframes fan-osc{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.m-fan .wl{animation:fan-wl .9s ease-out infinite}
@keyframes fan-wl{0%{transform:translateX(8px);opacity:0}30%{opacity:1}100%{transform:translateX(-10px);opacity:0}}
.m-fan .wr{animation:fan-wr .9s ease-out infinite}
@keyframes fan-wr{0%{transform:translateX(-8px);opacity:0}30%{opacity:1}100%{transform:translateX(10px);opacity:0}}
.m-fan .fast .wl,.m-fan .fast .wr{animation-duration:.4s}
.m-fan .vib{animation:fan-vib .12s linear infinite}
@keyframes fan-vib{0%,100%{transform:translateX(-1px)}50%{transform:translateX(1px)}}
.m-fan .gl{animation:fan-gl .5s ease-in-out infinite alternate}
@keyframes fan-gl{from{opacity:.15}to{opacity:.5}}
.m-fan .dec{animation:fan-dec 1.8s cubic-bezier(.1,.7,.2,1) 1,fan-sp 8s linear 1.8s infinite}

.m-fan .hop{animation:fan-hop 1.8s ease-out 1}

.m-fan .tick{stroke-dasharray:30;animation:fan-tick 2s ease-out infinite}
@keyframes fan-tick{0%{stroke-dashoffset:30}30%,100%{stroke-dashoffset:0}}
.m-fan .bur{animation:fan-bur 1.4s ease-out infinite}

.m-fan .jam{animation:fan-jam 1.4s steps(1) infinite}

.m-fan .shk{animation:fan-shk .35s linear infinite}
@keyframes fan-shk{0%,100%{transform:rotate(-3deg)}25%{transform:rotate(2deg) translateX(-2px)}75%{transform:rotate(4deg) translateX(2px)}}
.m-fan .fl{animation:fan-fl .8s steps(1) infinite}
@keyframes fan-fl{0%{opacity:1}50%{opacity:.45}}
.m-fan .sm{animation:fan-sm 2s ease-out infinite}
@keyframes fan-sm{0%{transform:translate(0,4px) scale(.4);opacity:.8}100%{transform:translate(5px,-18px) scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.m-fan *{animation-duration:8s!important}}
</style>
