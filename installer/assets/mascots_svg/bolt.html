<style>
.m-bolt [class]{transform-box:fill-box;transform-origin:center}
.m-bolt .breathe{animation:bolt-breathe 4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bolt-breathe{50%{transform:scale(1.03)}}
.m-bolt .glow{animation:bolt-glow 4s ease-in-out infinite}
@keyframes bolt-glow{50%{opacity:.3;transform:scale(1.08)}}
.m-bolt .zz{animation:bolt-z 3.6s ease-in infinite}
@keyframes bolt-z{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.m-bolt .bob{animation:bolt-bob 2s ease-in-out infinite}
@keyframes bolt-bob{50%{transform:translateY(-4px) rotate(2deg)}}
.m-bolt .pulse{animation:bolt-pulse 2s ease-in-out infinite}
@keyframes bolt-pulse{50%{opacity:.35}}
.m-bolt .tw{animation:bolt-tw 1.4s steps(1) infinite}
.m-bolt .tw2{animation:bolt-tw 1.4s steps(1) -.7s infinite}
@keyframes bolt-tw{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1)}60%{opacity:.2;transform:scale(.6)}80%{opacity:0}}
.m-bolt .shake{animation:bolt-shake .14s linear infinite}
@keyframes bolt-shake{25%{transform:translate(-1.5px,1px)}75%{transform:translate(1.5px,-1px)}}
.m-bolt .charge{animation:bolt-charge .7s ease-in-out infinite}
@keyframes bolt-charge{0%,100%{opacity:0}50%{opacity:.85}}
.m-bolt .arc{animation:bolt-arc .5s steps(1) infinite}
.m-bolt .arc2{animation:bolt-arc .5s steps(1) -.25s infinite}
@keyframes bolt-arc{0%{opacity:0}20%{opacity:1}55%{opacity:0}}
.m-bolt .ring{animation:bolt-ring 1s ease-out infinite}
@keyframes bolt-ring{0%{opacity:.5;transform:scale(.6)}100%{opacity:0;transform:scale(1.3)}}
.m-bolt .drop{animation:bolt-drop .9s cubic-bezier(.6,0,.9,.6) infinite}
@keyframes bolt-drop{0%{transform:translateY(-8px) scaleY(1.06);opacity:.3}25%{transform:translateY(0) scaleY(1);opacity:1}45%{transform:scale(1.07,.95)}70%,100%{transform:none}}
.m-bolt .flash{animation:bolt-flash .9s linear infinite}
@keyframes bolt-flash{0%,18%{opacity:0}25%{opacity:.9}55%,100%{opacity:0}}
.m-bolt .impact{animation:bolt-imp .9s ease-out infinite}
@keyframes bolt-imp{0%,22%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}
.m-bolt .beat{animation:bolt-beat .3s ease-in-out infinite}
@keyframes bolt-beat{50%{transform:scaleX(.92)}}
.m-bolt .w1{animation:bolt-w .6s ease-out infinite}
.m-bolt .w2{animation:bolt-w .6s ease-out -.4s infinite}
@keyframes bolt-w{0%{opacity:0;transform:translateX(-4px)}30%{opacity:.9}100%{opacity:0;transform:translateX(5px)}}
.m-bolt .hop{animation:bolt-hop 1.2s ease-in-out infinite}
@keyframes bolt-hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px) scale(1.04)}55%{transform:translateY(0) scale(1.04,.96)}}
.m-bolt .rays{animation:bolt-rays 1.6s ease-in-out infinite}
@keyframes bolt-rays{0%{opacity:0;transform:scale(.5)}25%,70%{opacity:1;transform:scale(1)}100%{opacity:.5;transform:scale(1.1)}}
.m-bolt .red{animation:bolt-red .8s ease-in-out infinite}
@keyframes bolt-red{0%,100%{fill:#eb6f92;stroke:#eb6f92}50%{fill:#e5484d;stroke:#e5484d}}
.m-bolt .stut{animation:bolt-stut 1.1s steps(1) infinite}
@keyframes bolt-stut{0%{opacity:1}10%{opacity:.3}20%{opacity:1}30%{opacity:.45}40%,80%{opacity:1}90%{opacity:.35}}
.m-bolt .jit{animation:bolt-jit .9s linear infinite}
@keyframes bolt-jit{0%,100%{transform:rotate(-12deg)}15%{transform:rotate(-16deg) translate(-2px,1px)}30%{transform:rotate(-9deg) translate(2px,-1px)}45%{transform:rotate(-14deg)}60%{transform:rotate(-10deg) translate(-2px,0)}}
.m-bolt .puff{animation:bolt-puff 2s ease-out infinite}
.m-bolt .puff2{animation:bolt-puff 2s ease-out -1s infinite}
@keyframes bolt-puff{0%{opacity:.7;transform:translateY(6px) scale(.5)}100%{opacity:0;transform:translateY(-18px) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.m-bolt [class]{animation-duration:8s!important}}
</style>
