<style>
.m-comet [class]{transform-box:fill-box;transform-origin:center}
.m-comet .flame{transform-origin:100% 50%;animation:comet-fl 1.1s ease-in-out infinite}
.m-comet .fl2{transform-origin:100% 50%;animation:comet-fl 1.1s ease-in-out -.5s infinite}
@keyframes comet-fl{50%{transform:scale(1.1,.9)}}
.m-comet .fast{transform-origin:100% 50%;animation:comet-fast .25s ease-in-out infinite}
@keyframes comet-fast{50%{transform:scale(1.14,.82)}}
.m-comet .bob{animation:comet-bob 2.2s ease-in-out infinite}
@keyframes comet-bob{50%{transform:translateY(-5px)}}
.m-comet .breathe{animation:comet-br 4s ease-in-out infinite}
@keyframes comet-br{50%{transform:scale(1.04)}}
.m-comet .zz{animation:comet-z 3.6s ease-in infinite}
@keyframes comet-z{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.m-comet .tw{animation:comet-tw 1.4s steps(1) infinite}
.m-comet .tw2{animation:comet-tw 1.4s steps(1) -.7s infinite}
@keyframes comet-tw{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1)}60%{opacity:.2;transform:scale(.6)}80%{opacity:0}}
.m-comet .sp{animation:comet-sp 1.6s linear infinite}
.m-comet .sp2{animation:comet-sp 1.6s linear -.8s infinite}
@keyframes comet-sp{0%{opacity:0;transform:translateX(8px)}20%{opacity:1}100%{opacity:0;transform:translateX(-24px)}}
.m-comet .orb{animation:comet-orb 2s linear infinite}
@keyframes comet-orb{to{transform:rotate(360deg)}}
.m-comet .ln{animation:comet-ln .45s linear infinite}
.m-comet .ln2{animation:comet-ln .45s linear -.2s infinite}
@keyframes comet-ln{0%{opacity:0;transform:translateX(14px)}30%{opacity:.9}100%{opacity:0;transform:translateX(-22px)}}
.m-comet .beat{animation:comet-beat .3s ease-in-out infinite}
@keyframes comet-beat{50%{transform:scale(1.1)}}
.m-comet .shk{animation:comet-shk .12s linear infinite}
@keyframes comet-shk{25%{transform:translateY(-1.5px)}75%{transform:translateY(1.5px)}}
.m-comet .halo{animation:comet-halo 1.4s ease-out infinite}
@keyframes comet-halo{0%{opacity:.8;transform:scale(.7)}100%{opacity:0;transform:scale(1.5)}}
.m-comet .hop{animation:comet-hop 1.2s ease-in-out infinite}
@keyframes comet-hop{30%{transform:translateY(-7px)}55%{transform:translateY(0)}}
.m-comet .red{animation:comet-red .8s ease-in-out infinite}
@keyframes comet-red{0%,100%{fill:#eb6f92}50%{fill:#e5484d}}
.m-comet .tum{animation:comet-tum 1.2s ease-in-out infinite}
@keyframes comet-tum{0%,100%{transform:rotate(-14deg)}25%{transform:rotate(10deg) translateX(3px)}50%{transform:rotate(-20deg) translateX(-2px)}75%{transform:rotate(6deg)}}
.m-comet .out{animation:comet-out 1.2s steps(1) infinite}
@keyframes comet-out{0%{opacity:1}15%{opacity:.1}30%{opacity:.9}45%{opacity:.1}60%,100%{opacity:.35}}
.m-comet .arc{animation:comet-arc .5s steps(1) infinite}
.m-comet .arc2{animation:comet-arc .5s steps(1) -.25s infinite}
@keyframes comet-arc{0%{opacity:0}20%{opacity:1}55%{opacity:0}}
.m-comet .puff{animation:comet-puff 2s ease-out infinite}
.m-comet .puff2{animation:comet-puff 2s ease-out -1s infinite}
@keyframes comet-puff{0%{opacity:.7;transform:translateY(6px) scale(.5)}100%{opacity:0;transform:translateY(-18px) scale(1.4)}}
@media (prefers-reduced-motion:reduce){.m-comet [class]{animation-duration:8s!important}}
</style>
