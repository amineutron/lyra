<style>
.m-snail *{transform-box:fill-box;transform-origin:center;stroke-linecap:round;stroke-linejoin:round}
.m-snail .br{animation:snail-br 4s ease-in-out infinite;transform-origin:50% 100%}
.m-snail .bd{animation:snail-bd 3.6s ease-in-out infinite;transform-origin:20% 100%}
.m-snail .bw{animation-duration:1.5s}
.m-snail .bq{animation-duration:.8s}
.m-snail .st{animation:snail-st 3.2s ease-in-out infinite;transform-origin:50% 100%}
.m-snail .sb{animation-delay:-1.4s;animation-duration:3.8s}
.m-snail .sf{animation-duration:.9s}
.m-snail .sd{animation-duration:2s}
.m-snail .ey{animation:snail-bl 4.4s infinite}
.m-snail .tr{stroke-dasharray:2 11;animation:snail-tr 2.4s linear infinite}
.m-snail .tf{animation-duration:.7s}
.m-snail .sp{animation:snail-sp 3s linear infinite}
.m-snail .sh{animation:snail-sh 1.5s ease-in-out infinite}
.m-snail .gl{animation:snail-gl 1.5s ease-in-out infinite;opacity:0}
.m-snail .mo{animation:snail-mo .42s ease-in-out infinite;transform-origin:50% 0}
.m-snail .wv{animation:snail-wv .42s ease-in-out infinite alternate}
.m-snail .jp{animation:snail-jp 2.6s ease-in-out infinite;transform-origin:50% 100%}
.m-snail .tw{animation:snail-tw 1.5s ease-in-out infinite}
.m-snail .t2{animation-delay:-.5s}.m-snail .t3{animation-delay:-1s}
.m-snail .up{animation:snail-up 3.4s ease-in infinite;opacity:0}
.m-snail .u2{animation-delay:-1.7s}
.m-snail .sk{animation:snail-sk 2.2s ease-in-out infinite;transform-origin:50% 100%}
.m-snail .rd{animation:snail-rd 2.2s ease-in-out infinite;opacity:.55}
.m-snail .dr{animation:snail-dr 2.2s ease-in infinite;opacity:0}
@keyframes snail-br{50%{transform:scale(1.02,1.05)}}
@keyframes snail-bd{50%{transform:scaleX(1.04)}}

@keyframes snail-gl{0%,20%{opacity:0}50%{opacity:.9}80%,100%{opacity:0}}
@keyframes snail-mo{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
@keyframes snail-wv{to{transform:translateX(2px)}}
@keyframes snail-jp{0%,10%{transform:none}22%{transform:scale(1.06,.9)}42%{transform:translateY(-12px) scale(.96,1.05)}62%{transform:scale(1.06,.92)}75%,100%{transform:translateY(-1px)}}
@keyframes snail-tw{0%,100%{opacity:.2;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
@keyframes snail-up{0%{transform:translate(0,6px) scale(.6);opacity:0}25%{opacity:1}100%{transform:translate(8px,-16px);opacity:0}}
@keyframes snail-sk{0%,100%{transform:rotate(0)}8%{transform:rotate(-5deg)}16%{transform:rotate(5deg)}24%{transform:rotate(-3deg)}32%{transform:rotate(2deg)}42%{transform:rotate(0)}}
@keyframes snail-rd{0%,45%,100%{opacity:.5}10%,30%{opacity:.8}}
@keyframes snail-dr{0%,30%{opacity:0;transform:translateY(0)}45%{opacity:1}90%{opacity:0;transform:translateY(14px)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.m-snail *{animation-duration:8s!important}}
</style>
