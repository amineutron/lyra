<style>
.m-rocket *{transform-box:fill-box}
.m-rocket .bd{transform-origin:50% 100%}
.m-rocket .ff{transform-origin:50% 0}
.m-rocket .sk{fill:#c9d1e4;transform-origin:50% 50%;opacity:0}
.m-rocket .sp{fill:#fbe0a8;transform-origin:50% 50%}
.m-rocket .st{fill:#7C6CF0;transform-origin:50% 50%}
.m-rocket .rg{fill:none;stroke:#7C6CF0;stroke-width:2;transform-origin:50% 50%;opacity:0;animation:rocket-ring 2s ease-out infinite}
.m-rocket .zz{fill:none;stroke:#fbe0a8;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:rocket-z 3.6s ease-in-out infinite}
.m-rocket .ln{fill:none;stroke:#fbe0a8;stroke-width:2.4;stroke-linecap:round}
.m-rocket .a1{animation:rocket-br 4s ease-in-out infinite}
.m-rocket .a2{animation:rocket-idle 2.4s ease-in-out infinite}
.m-rocket .a3{animation:rocket-fl .3s steps(2) infinite}
.m-rocket .a4{animation:rocket-glow 1.6s ease-in-out infinite}
.m-rocket .l1{animation:rocket-lift 2.8s ease-in infinite}
.m-rocket .l2{animation:rocket-shake 2.8s linear infinite}
.m-rocket .l3{animation:rocket-flame 2.8s linear infinite}
.m-rocket .l4{animation:rocket-smoke 2.8s ease-out infinite}
.m-rocket .l5{animation:rocket-streak 2.8s linear infinite}
.m-rocket .b1{animation:rocket-vib .12s linear infinite}
.m-rocket .b2{animation:rocket-hov .9s ease-in-out infinite}
.m-rocket .b3{animation:rocket-lvl .9s steps(1) infinite}
.m-rocket .b4{animation:rocket-spark .45s linear infinite}
.m-rocket .c1{animation:rocket-bob 2s ease-in-out infinite}
.m-rocket .c2{animation:rocket-twk 1.2s ease-in-out infinite}
.m-rocket .e1{animation:rocket-err 3s ease-in-out infinite}
.m-rocket .e2{animation:rocket-cough 3s steps(1) infinite}
.m-rocket .e3{animation:rocket-puff 3s ease-out infinite}
.m-rocket .e4{animation:rocket-red 1.5s ease-in-out infinite}
@keyframes rocket-br{0%,100%{transform:scale(1.01,.985)}50%{transform:scale(.995,1.01)}}
@keyframes rocket-idle{0%,100%{transform:translateX(-.6px)}50%{transform:translateX(.6px)}}
@keyframes rocket-fl{0%{transform:scaleY(.18)}100%{transform:scaleY(.34)}}
@keyframes rocket-glow{0%,100%{opacity:.1}50%{opacity:.7}}
@keyframes rocket-ring{0%{transform:scale(.5);opacity:.8}100%{transform:scale(2.4);opacity:0}}
@keyframes rocket-lift{0%,30%{transform:translateY(0) scale(1);opacity:1}62%{transform:translateY(-44px) scale(.42);opacity:1}72%{transform:translateY(-62px) scale(.2);opacity:0}84%{transform:translateY(0) scale(1);opacity:0}92%,100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes rocket-shake{0%{transform:translateX(0)}5%{transform:translateX(-.8px)}10%{transform:translateX(.8px)}15%{transform:translateX(-1.4px)}20%{transform:translateX(1.4px)}25%{transform:translateX(-2px)}30%{transform:translateX(2px)}35%,100%{transform:translateX(0)}}
@keyframes rocket-flame{0%{transform:scaleY(.2)}30%{transform:scaleY(1)}62%{transform:scaleY(1.5)}100%{transform:scaleY(.2)}}
@keyframes rocket-smoke{0%{transform:scale(.3);opacity:0}25%{opacity:.7}65%{transform:translate(var(--x),-6px) scale(1.5);opacity:0}100%{opacity:0}}
@keyframes rocket-streak{0%,40%{transform:translateY(-14px);opacity:0}55%{opacity:.8}75%{transform:translateY(22px);opacity:0}100%{opacity:0}}
@keyframes rocket-vib{0%{transform:translate(-1px,0)}50%{transform:translate(1px,-.6px)}100%{transform:translate(-1px,0)}}
@keyframes rocket-hov{0%,100%{transform:translateY(-1px)}50%{transform:translateY(-5px)}}
@keyframes rocket-lvl{0%{transform:scaleY(.5)}25%{transform:scaleY(.85)}50%{transform:scaleY(1.2)}75%{transform:scaleY(.9)}}
@keyframes rocket-spark{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes rocket-bob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(-8px)}}
@keyframes rocket-twk{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes rocket-err{0%,60%,100%{transform:rotate(-3deg)}15%{transform:translateY(-9px) rotate(5deg)}30%{transform:translateY(-3px) rotate(-6deg)}40%{transform:translateY(1px) rotate(-9deg)}50%{transform:rotate(-9deg)}}
@keyframes rocket-cough{0%{transform:scaleY(.7)}10%{transform:scaleY(.1)}20%{transform:scaleY(.55)}30%,100%{transform:scaleY(0)}}
@keyframes rocket-puff{0%{transform:translateY(0) scale(.4);opacity:0}15%{opacity:.8}100%{transform:translateY(-22px) scale(1.5);opacity:0}}
@keyframes rocket-red{0%{opacity:.2}30%,100%{opacity:.7}}
@keyframes rocket-z{0%{opacity:0;transform:translate(0,6px)}30%,60%{opacity:.9}100%{opacity:0;transform:translate(6px,-8px)}}
@media (prefers-reduced-motion:reduce){.m-rocket *{animation-duration:8s!important}}
</style>
