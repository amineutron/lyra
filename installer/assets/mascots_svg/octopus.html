<style>.m-octopus *{transform-box:fill-box;transform-origin:center}

.m-octopus{color:#eb6f92}

.m-octopus .hot{animation:octopus-hot 1.6s ease-in-out infinite}
@keyframes octopus-hot{0%,100%{color:#ee5f7a}40%,60%{color:#e5484d}}
