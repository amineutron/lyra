<style>
.m-robot *{transform-box:fill-box;transform-origin:center}
.m-robot .al{transform-origin:100% 0}.m-robot .ar{transform-origin:0 0;--k:-1}
.m-robot .arm path{stroke:#c4506f;stroke-width:6;stroke-linecap:round}.m-robot .arm circle{fill:#f7a3bb;r:4.3px}
.m-robot .bar{transform-origin:50% 100%}
.m-robot .ant{transform-origin:50% 100%}
.m-robot .bob{animation:robot-bob 2.6s ease-in-out infinite}
.m-robot .eye{animation:robot-blink 4s infinite}
.m-robot .led{animation:robot-led 1.2s ease-in-out infinite}
.m-robot .zz{animation:robot-zz 3s ease-in-out -1s infinite}
.m-robot .s-idle .bar{animation:robot-eq 2s ease-in-out infinite}
.m-robot .s-idle .ant{animation:robot-sway 3s ease-in-out infinite}
.m-robot .s-work .spin{animation:robot-spin 1s linear infinite}
.m-robot .s-work .pup{animation:robot-scan 1.4s ease-in-out infinite}
.m-robot .s-work .ant{animation:robot-sway .5s ease-in-out infinite}
.m-robot .s-busy .bar{animation:robot-eq .45s ease-in-out infinite}
.m-robot .s-busy .head{animation:robot-nod .45s ease-in-out infinite}
.m-robot .s-ok .all{animation:robot-jump 1s ease-out 2}
.m-robot .s-ok .chk{stroke-dasharray:30;animation:robot-chk 2s ease-out -.6s infinite}
.m-robot .s-err .all{animation:robot-shake .4s ease-in-out 4}
.m-robot .red{animation:robot-red 1s ease-in-out infinite}
.m-robot .gl{animation:robot-gl .5s steps(2) infinite}
.m-robot .puff{animation:robot-puff 2s ease-out infinite}
.m-robot .s-idle .ar{animation:robot-lift 3.4s ease-in-out infinite}
.m-robot .s-work .al{animation:robot-type .5s ease-in-out infinite}
.m-robot .s-work .ar{animation:robot-type .5s ease-in-out -.25s infinite}
.m-robot .s-busy .al{animation:robot-wave .6s ease-in-out infinite}
.m-robot .s-busy .ar{animation:robot-wave .6s ease-in-out -.3s infinite}
.m-robot .s-ok .al{transform:rotate(125deg)}.m-robot .s-ok .ar{transform:rotate(-125deg)}
.m-robot .s-err .al{transform:rotate(-12deg)}.m-robot .s-err .ar{transform:rotate(12deg)}
.m-robot .s .d1{animation-delay:-.3s}.m-robot .s .d2{animation-delay:-.6s}.m-robot .s .d3{animation-delay:-.9s}
@keyframes robot-bob{50%{transform:translateY(-2px)}}
@keyframes robot-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes robot-led{50%{opacity:.35}}
@keyframes robot-zz{0%{transform:translate(0,4px);opacity:0}30%{opacity:1}100%{transform:translate(6px,-10px);opacity:0}}
@keyframes robot-eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes robot-sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes robot-lift{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes robot-spin{to{transform:rotate(360deg)}}
@keyframes robot-scan{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes robot-type{0%,100%{transform:rotate(0)}50%{transform:rotate(calc(var(--k,1)*55deg))}}
@keyframes robot-wave{0%,100%{transform:rotate(calc(var(--k,1)*10deg))}50%{transform:rotate(calc(var(--k,1)*100deg))}}
@keyframes robot-nod{50%{transform:translateY(1.5px)}}
@keyframes robot-jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes robot-chk{0%{stroke-dashoffset:30}40%,100%{stroke-dashoffset:0}}
@keyframes robot-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px) rotate(-2deg)}75%{transform:translateX(3px) rotate(2deg)}}
@keyframes robot-red{0%,100%{opacity:.25}50%{opacity:.6}}
@keyframes robot-gl{50%{transform:translateX(3px)}}
@keyframes robot-puff{0%{transform:translate(0,0) scale(.4);opacity:.9}100%{transform:translate(2px,-14px) scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.m-robot *{animation-duration:6s !important}}
</style>
