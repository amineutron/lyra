<style>
.m-drop *{transform-box:fill-box}
.m-drop .bd{transform-origin:50% 100%}
.m-drop .rp{fill:none;stroke:#b9d7f2;stroke-width:2;transform-origin:50% 50%;opacity:0}
.m-drop .re{stroke:#eb6f92}
.m-drop .dt{fill:#b9d7f2;transform-origin:50% 50%}
.m-drop .st{fill:#7C6CF0;transform-origin:50% 50%}
.m-drop .zz{fill:none;stroke:#b9d7f2;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:drop-z 3.6s ease-in-out infinite}
.m-drop .a1{animation:drop-wob 1.9s ease-in-out infinite}
.m-drop .a3{animation:drop-ring 2.6s ease-out infinite}
.m-drop .a4{animation:drop-ring 1.2s ease-out infinite}
.m-drop .a5{animation:drop-ring 1.2s .6s ease-out infinite}
.m-drop .a6{animation:drop-sway 2.2s ease-in-out infinite}
.m-drop .a8{animation:drop-rise 2.4s ease-out infinite}
.m-drop .a9{animation:drop-beat .6s ease-in-out infinite}
.m-drop .a0{animation:drop-fall .6s ease-in infinite}
.m-drop .b2{animation:drop-jump 2.6s ease-in-out infinite}
.m-drop .b3{animation:drop-splash 2.6s ease-out infinite}
.m-drop .b4{animation:drop-shake .45s ease-in-out infinite;transform-origin:50% 100%}
.m-drop .b5{animation:drop-sweat 2s ease-out infinite}
.m-drop .b6{animation:drop-breath 4s ease-in-out infinite}
.m-drop .b7{animation:drop-twk 1s ease-in-out infinite}
.m-drop .b9{animation:drop-tint 2.2s ease-in-out infinite}
.m-drop .c1{animation:drop-red 1.8s ease-in-out infinite}
@keyframes drop-wob{0%,100%{transform:scale(1.05,.94)}50%{transform:scale(.95,1.06)}}
@keyframes drop-ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2);opacity:0}}
@keyframes drop-sway{0%,100%{transform:rotate(-6deg) scale(1.03,.97)}50%{transform:rotate(6deg) scale(.97,1.03)}}
@keyframes drop-rise{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-34px);opacity:0}}
@keyframes drop-beat{0%,100%{transform:scale(1.1,.88)}40%{transform:scale(.92,1.12)}}
@keyframes drop-fall{0%{transform:translateY(-4px) scale(.6);opacity:0}15%{opacity:1}80%{transform:translateY(30px) scale(.5);opacity:1}100%{transform:translateY(36px) scale(.2);opacity:0}}
@keyframes drop-jump{0%,60%,100%{transform:translateY(0) scale(1.15,.82)}12%{transform:translateY(0) scale(.9,1.15)}35%{transform:translateY(-13px) scale(.92,1.08)}48%{transform:translateY(0) scale(1.2,.8)}56%{transform:translateY(0) scale(.95,1.06)}}
@keyframes drop-splash{0%,40%{transform:translate(0,0) scale(.3);opacity:0}48%{opacity:1}75%{transform:translate(var(--x),-22px) scale(1);opacity:.9}100%{transform:translate(var(--x),0) scale(.6);opacity:0}}
@keyframes drop-shake{0%,100%{transform:scale(1.22,.74) rotate(-5deg)}50%{transform:scale(1.22,.74) rotate(5deg)}}
@keyframes drop-sweat{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
@keyframes drop-breath{0%,100%{transform:scale(1.06,.88)}50%{transform:scale(1.02,.94)}}
@keyframes drop-twk{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1);opacity:1}}
@keyframes drop-tint{0%,100%{opacity:0}50%{opacity:.55}}
@keyframes drop-red{0%{opacity:.2}30%,100%{opacity:.85}}
@keyframes drop-z{0%{opacity:0;transform:translate(0,6px)}30%,60%{opacity:.9}100%{opacity:0;transform:translate(6px,-8px)}}
@media (prefers-reduced-motion:reduce){.m-drop *{animation-duration:6s!important}}
</style>

 </g>
