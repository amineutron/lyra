name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    uses: amineutron/.github/.github/workflows/python-ci.yml@main
    with:
      python-versions: '["3.11", "3.12"]'
      test-command: "uv run --frozen python -m pytest tests/unit tests/installer scenes/ironman -q -p no:cacheprovider"
      # lint ruff bloquant depuis 2026-09-25 (dette de 240 remarques soldee, voir CHANGELOG)
  licences-tierces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Inventaire des licences (THIRD_PARTY_LICENSES.md doit être à jour)
        run: |
          uv run --frozen pip-licenses --format=markdown --with-urls --order=license | awk '!seen[$0]++' > /tmp/tpl.md
          if ! diff -q <(tail -n +3 THIRD_PARTY_LICENSES.md) /tmp/tpl.md >/dev/null; then
            echo "THIRD_PARTY_LICENSES.md est périmé : regénérez-le avec make licenses"; diff <(tail -n +3 THIRD_PARTY_LICENSES.md) /tmp/tpl.md | head -20; exit 1; fi
