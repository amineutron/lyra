# À chaque tag v* : build du wheel, publication PyPI par Trusted Publishing
# (environnement "pypi" déclaré côté PyPI et côté dépôt), release GitHub avec
# des notes générées par git-cliff depuis les commits conventionnels, le wheel
# et le sdist attachés, plus sbom.json (inventaire CycloneDX des composants).
# Wheel et sdist portent deux attestations signées par Sigstore : provenance
# (construits ici, depuis ce commit) et SBOM. Vérification :
#   gh attestation verify <fichier> --owner amineutron
# Procédure complète : docs/dev/release-process.md
#
# Le workflow est volontairement autonome : PyPI refuse les jetons OIDC émis
# depuis un workflow réutilisable (claim job_workflow_ref différent du dépôt,
# erreur invalid-publisher, constatée le 2026-09-24).
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # certificat Sigstore des attestations
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: uv.lock à jour avec pyproject.toml
        run: uv lock --check
      - run: uv build
      - name: Inventaire des composants (SBOM CycloneDX)
        # dépendances de base + extra gpu, sans les outils de développement ;
        # versions exactes lues dans uv.lock
        run: |
          mkdir -p sbom
          uv export --frozen --no-dev --extra gpu --format cyclonedx1.5 -o sbom/sbom.json > /dev/null
      - name: Attestation de provenance (wheel et sdist)
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Attestation SBOM (wheel et sdist)
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          sbom-path: sbom/sbom.json
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # git-cliff lit l'historique jusqu'au tag précédent
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: sbom/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Notes de release (git-cliff, cliff.toml)
        run: uvx git-cliff@2.14.2 --latest --strip all -o RELEASE_NOTES.md
      - name: Release GitHub avec les notes et les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
          gh release upload "${GITHUB_REF_NAME}" dist/* sbom/sbom.json --repo "${GITHUB_REPOSITORY}" --clobber
