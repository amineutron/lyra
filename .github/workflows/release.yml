# À chaque tag v* : build du wheel, publication PyPI (Trusted Publishing,
# environnement "pypi"), release GitHub avec les fichiers.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  release:
    uses: amineutron/.github/.github/workflows/release-pypi.yml@main
    permissions:
      id-token: write
      contents: write
