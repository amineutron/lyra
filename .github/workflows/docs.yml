# Site de documentation sur GitHub Pages : https://amineutron.github.io/lyra/
# Construit (mkdocs --strict) à chaque PR qui touche une page publiée, et publié à chaque
# envoi sur main. Les pages reprennent des sections du README, du README de l'installeur,
# de BENCHMARKS et du CHANGELOG (docs/hooks/site_links.py) : ces fichiers déclenchent aussi.
name: docs
on:
  push:
    branches: [main]
    paths: &pages
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "BENCHMARKS.md"
      - "CHANGELOG.md"
      - "installer/README.md"
      - "deploy/eval/README.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *pages
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --only-group docs --python 3.12
      - name: Construire (un lien ou une inclusion cassés font échouer)
        run: uv run --frozen --only-group docs mkdocs build --strict -d site
      - name: Aucun chemin personnel ni adresse de réseau local dans le site
        run: |
          # même motif que la CI des tests ; 192.168.122.0/24 = réseau NAT par défaut de libvirt
          hits=$(grep -rlP '/home/(?!user/|runner/)[a-z]+/|192\.168\.(?!122\.)[0-9]+\.[0-9]+' site || true)
          if [ -n "$hits" ]; then echo "Trouvé dans :"; echo "$hits"; exit 1; fi
      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6
      - if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
